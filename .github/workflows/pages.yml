name: Deploy to GitHub Pages

# Deliberately not pinned to a branch name. The job guard below already limits
# pushes to the default branch, so a filter here would be redundant — and it
# would disable the escape hatch: a manual run (workflow_dispatch) is allowed
# from any branch, which is how a working branch gets published for review
# before anyone merges it.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the instrumentation parser
        run: npm test

      - name: Rebuild the index from committed data
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/assets _site/lib _site/data _site/dist
          cp index.html _site/
          cp assets/* _site/assets/
          cp lib/* _site/lib/
          cp data/works.json _site/data/
          # The freshness check fetches this with cache: 'no-store'; without it
          # published the check silently does nothing.
          cp data/version.json _site/data/
          # Same path as the repo layout, so the footer link resolves whether
          # the site is served by this workflow or straight from the branch.
          cp dist/trumpet-finder.html _site/dist/trumpet-finder.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
